[[haybales]]
name = "haybale-visiongraph"
label = "Visiongraph"
version = "0.0.37"
require = "haywire-core>=0.1.0"
description = "Visiongraph is a computer-vision pipeline library designed to simplify the prototyping of image-based algorithms"
source = "git"
install_spec = "haybale-visiongraph @ git+https://github.com/going-haywire/haybale-visiongraph.git@v0.0.37#subdirectory=barn/haybale-visiongraph"
tags = [ "computer vision", "machine learning", "camera", "image capture",]
on_reload = "none"
linked_libraries = [ "haybale_core",]
origin = "https://github.com/going-haywire/haybale-visiongraph"
origin_provider = "github"
homepage_url = "https://github.com/going-haywire/haybale-visiongraph"
documentation_url = "https://cansik.github.io/visiongraph/visiongraph.html#documentation"
issues_url = "https://github.com/going-haywire/haybale-visiongraph/issues"
[[haybales.authors]]
name = "cansik"
url = "https://github.com/cansik"

[[haybales.authors]]
name = "maybites"
url = "https://github.com/maybites"


