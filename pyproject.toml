[project]
name = "haybale-visiongraph-dev"
version = "0.0.17"
requires-python = ">=3.11"
dependencies = ["haywire-studio>=0.6.0", "haybale-marketplace>=0.6.0", "haybale-visiongraph", "haybale-core>=0.6.0", "haybale-studio>=0.6.0", "haybale-share>=0.6.0", "haybale-graph-editor>=0.6.0", "haybale-haystack>=0.6.0"]

[tool.uv.workspace]
members = [ "barn/*",]

[tool.uv.sources.haybale-visiongraph]
workspace = true

[tool.uv.sources.haywire-studio]
path = "../haywire-repo/packages/haywire-studio"
editable = true

[tool.uv.sources.haywire-core]
path = "../haywire-repo/packages/haywire-core"
editable = true

[tool.uv.sources.haybale-image]
path = "../haywire-repo/barn/haybale-image"
editable = true

[tool.uv.sources.haybale-models]
path = "../haywire-repo/barn/haybale-models"
editable = true

[tool.uv.sources.haybale-core]
path = "../haywire-repo/barn/haybale-core"
editable = true

[tool.uv.sources.haybale-studio]
path = "../haywire-repo/barn/haybale-studio"
editable = true

[tool.uv.sources.haybale-marketplace]
path = "../haywire-repo/barn/haybale-marketplace"
editable = true

[tool.uv.sources.haybale-share]
path = "../haywire-repo/barn/haybale-share"
editable = true

[tool.uv.sources.haybale-graph-editor]
path = "../haywire-repo/barn/haybale-graph-editor"
editable = true

[tool.uv.sources.haybale-haystack]
path = "../haywire-repo/barn/haybale-haystack"
editable = true

[dependency-groups]
dev = [
    # Floors at the version in use: the floors CI job lowers the dev group too (core's ADR 0095).
    "pytest>=9.2",
    "pytest-timeout>=2.4",
    "ruff==0.12.12",
]

[tool.ruff]
# The framework monorepo's limit.
line-length = 109

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"haywire.core".msg = "Import from haywire.api (Author API); haywire.core is internal."
"haywire.ui".msg = "Import from haywire.api or haywire.api.workbench; haywire.ui is internal."
"haywire.barn".msg = "Import from haywire.api; haywire.barn is internal."

[tool.ruff.lint.per-file-ignores]
# Tests reach into the framework to set it up; the ban is for the libraries.
"tests/**" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, full system)",
]
addopts = "-v --strict-markers --tb=short"
timeout = 120

[tool.haywire.marketstall]
# This project publishes released wheels to PyPI, so every marketstall row
# carries `haybale-visiongraph==<version>` rather than a git clone spec.
# One coordinate per version: a PyPI row and a git row of the same name read
# as two different libraries to a subscriber.
distribute = "pypi"

[tool.haywire.agents]
# The docs folder whose `serve: developer` pages the Farmhand bridge serves to agent
# sessions here: core's, through the core clone beside this repository.
developer-docs = "../haywire-repo/docs"
