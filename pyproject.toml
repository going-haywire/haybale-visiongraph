[project]
name = "haybale-visiongraph-dev"
version = "0.0.17"
requires-python = ">=3.11"
dependencies = ["haywire-studio>=0.0.39", "haybale-marketplace>=0.0.39", "haybale-visiongraph", "haybale-core", "haybale-studio", "haybale-share>=0.0.39", "haybale-graph-editor>=0.0.39", "haybale-haystack>=0.0.39"]

[tool.uv.workspace]
members = [ "barn/*",]

[tool.uv.sources.haybale-visiongraph]
workspace = true

[tool.uv.sources.haywire-studio]
path = "../haywire-repo/packages/haywire-studio"
editable = true

[tool.uv.sources.haywire-core]
path = "../haywire-repo/packages/haywire-core"
editable = true

[tool.uv.sources.haybale-core]
path = "../haywire-repo/barn/haybale-core"
editable = true

[tool.uv.sources.haybale-studio]
path = "../haywire-repo/barn/haybale-studio"
editable = true

[tool.uv.sources.haybale-marketplace]
path = "../haywire-repo/barn/haybale-marketplace"
editable = true

[tool.uv.sources.haybale-share]
path = "../haywire-repo/barn/haybale-share"
editable = true

[tool.uv.sources.haybale-graph-editor]
path = "../haywire-repo/barn/haybale-graph-editor"
editable = true

[tool.uv.sources.haybale-haystack]
path = "../haywire-repo/barn/haybale-haystack"
editable = true

[tool.haywire.marketstall]
pypi_marketplace_url = "https://going-haywire.github.io/haybale-visiongraph/marketplace.toml"