[project]
name = "haybale-visiongraph"
version = "0.0.22"
description = "Visiongraph library for Haywire node system demonstrating custom types, nodes, widgets, and renderers"
readme = "README.md"
requires-python = ">=3.12"
keywords = [ "haywire", "node-editor", "visual-programming", "visiongraph",]
dependencies = [
    "depthai~=2.30", 
    "fastapi", 
    "haybale-core>=0.0.32", 
    "haywire-core>=0.0.32", 
    "nicegui>=3.12.1", 
    "numpy", 
    "opencv-contrib-python>=5.0.0.93", 
    "typing_extensions>=4.15.0", 
    "visiongraph[onnx,openvino,mediapipe]"]
[[project.authors]]
name = "Haywire Team"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.license]
text = "MIT"

[project.entry-points."haywire.libraries"]
visiongraph = "haybale_visiongraph:Library"

[tool.hatch.build.targets.wheel]
packages = [ "haybale_visiongraph",]

[tool.hatch.build.targets.sdist]
include = [ "haybale_visiongraph/", "README.md",]
