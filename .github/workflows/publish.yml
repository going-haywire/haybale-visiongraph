name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────
# ADAPT THIS BLOCK — everything below it is generic and can stay as-is.
# ─────────────────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: '3.12'

  # Your PyPI distribution name — must match [project].name in pyproject.toml.
  DIST_NAME: haybale-visiongraph
  # The publishable package. The repo root is a dev-only uv workspace whose
  # [tool.uv.sources] point at a sibling monorepo that does not exist in CI —
  # every step below works from this directory so that shell is never loaded.
  PKG_DIR: barn/haybale-visiongraph
  # Human-readable name shown in the Library Browser.
  LIBRARY_LABEL: Visiongraph for Haywire
  # One line. Shown under the label in the browser.
  LIBRARY_DESCRIPTION: Visiongraph library for Haywire node system demonstrating custom types, nodes, widgets, and renderers
  # Your name, shown in the Library Browser.
  LIBRARY_AUTHOR: Martin Froehlich
  # Your repository, used for the "source" link on the catalog entry.
  SOURCE_URL: https://github.com/going-haywire/haybale-visiongraph

jobs:
  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      # The tag is the source of truth for the release. The wheel version comes
      # from the package's pyproject.toml, so a tag that disagrees with it would
      # publish one version while the feed below advertises another.
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(grep -m1 '^version' "${PKG_DIR}/pyproject.toml" | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match ${PKG_DIR}/pyproject.toml version ${PKG_VERSION}"
            exit 1
          fi
          echo "Version ${PKG_VERSION} matches tag."

      - name: Build wheel + sdist
        working-directory: ${{ env.PKG_DIR }}
        run: uv build --out-dir "${GITHUB_WORKSPACE}/dist"

      # Your gate. Keep it cheap and keep it here: a broken release is far more
      # expensive to withdraw from PyPI than to catch before upload. Installing
      # the built wheel into a clean venv resolves its dependencies against real
      # PyPI — the one thing a local editable checkout can never verify.
      # Resolution is checked before install: the dependency set includes heavy,
      # platform-specific wheels (depthai, onnxruntime, openvino, mediapipe) whose
      # availability differs by OS and Python version, so a resolver failure here
      # is a dependency-range bug to fix in pyproject.toml — not a flaky job.
      - name: Smoke-test the wheel
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} /tmp/smoke
          export VIRTUAL_ENV=/tmp/smoke
          if ! uv pip install --dry-run dist/*.whl; then
            echo "::error::Dependencies of ${DIST_NAME} do not resolve on linux/py${PYTHON_VERSION} from PyPI. Fix the ranges in ${PKG_DIR}/pyproject.toml before releasing."
            exit 1
          fi
          uv pip install dist/*.whl
          # Must be the venv's interpreter, not the runner's: VIRTUAL_ENV steers
          # uv, but a bare `python` still resolves via PATH to the system one.
          /tmp/smoke/bin/python -c "import haybale_visiongraph; print('imported', haybale_visiongraph.Library)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi                       # must match the Trusted Publisher config
      url: https://pypi.org/project/${{ env.DIST_NAME }}/
    permissions:
      contents: read
      id-token: write                  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` — the OIDC identity above is the credential.

  deploy-feed:
    name: Deploy marketplace feed to GitHub Pages
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write                  # to push the gh-pages branch
    steps:
      - uses: actions/checkout@v4

      # Reads the env: block at the top of this file — nothing to edit here.
      # The version comes from the tag that triggered the run (v1.2.0 → 1.2.0),
      # so the feed can never advertise a version you didn't publish.
      - name: Write marketplace.toml
        run: |
          mkdir -p feed
          VERSION="${GITHUB_REF_NAME#v}"
          cat > feed/marketplace.toml <<EOF
          # Released packages for ${DIST_NAME}.
          # Subscribe to this URL in the haywire Library Browser.
          # Generated by .github/workflows/publish.yml — do not edit by hand.

          [[haybales]]
          name = "${DIST_NAME}"
          label = "${LIBRARY_LABEL}"
          version = "${VERSION}"
          description = "${LIBRARY_DESCRIPTION}"
          author = "${LIBRARY_AUTHOR}"
          source = "pypi"
          install_spec = "${DIST_NAME}"
          tags = []
          dependencies = []
          source_url = "${SOURCE_URL}"
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./feed
          publish_branch: gh-pages
          keep_files: true